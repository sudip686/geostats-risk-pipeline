calibration:
  enabled: true
  method: quantile_mapping
  reference_columns:
    grade: TGC_%
  reference_data: Serric_Data.csv
ci:
  n_real: 80
compositing_length_m: 2.0
crs_epsg: 32737
cutoff_grade: 3.0
data_dir: data
declustering:
  cell_size_xy_m: 200
  cell_size_z_m: 5
  method: cell
density_t_per_m3: 2.43
domain_by_lithology: true
grade_field: tgc_pct
grade_units: '%'
grid:
  dx: 100
  dy: 100
  dz: 10
  nx: 13
  ny: 46
  nz: 27
  origin_xyz:
  - 475500
  - 9465400
  - 570
internal_validation:
  enabled: false
  model_csv: Tanga_MRE_2026-01-06 1/OneDrive_2026-01-06/Export Final/04 BM/CSV/MODEL_OK.csv
min_composite_length_m: 0.5
orebody:
  dip_deg: 32
  dip_direction_deg: 15
  dip_positive_down: true
  strike_deg: 105
rock_volume_factor: 0.055
sensitivity:
  enabled: false
  n_real: 40
simulation:
  krige_chunk_size: 2000
  kriging_type: OK
  max_neighbors: 24
  min_neighbors: 8
  n_jobs: 1
  n_real: 50
  search_radius_m:
  - 250
  - 120
  - 70
  seed: 1337
target_lith_codes:
- GRSC
- GRSC1
- GRSC2
- SAP (GRSC)
- SAPR (GRSC)
trend:
  allow_disable: false
  columns:
  - z
  enabled: true
validation:
  reference_columns:
    grade: TGC_%
    x: X
    y: Y
    z: Z
  reference_data: Serric_Data.csv
variogram:
  anisotropy:
    ranges_m:
      down_dip: 160
      normal: 70
      strike: 360
  directions:
  - azimuth: 105
    dip: 0
    name: along_strike
    tolerance: 22.5
  - azimuth: 15
    dip: 32
    name: down_dip
    tolerance: 22.5
  - azimuth: 195
    dip: 58
    name: normal_to_plane
    tolerance: 22.5
  fit_method: weighted_ls
  lag_m: 50
  max_distance_m: 500
  max_pairs: 200000
  max_samples: 800
  model_types:
  - exponential
  - spherical
  n_lags: 10
  tuning:
    enabled: true
    nugget_ratio: 0.3
    target_range_m: 200

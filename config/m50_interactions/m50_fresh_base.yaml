crs_epsg: 32737
data_dir: data
grade_field: tgc_pct
grade_units: '%'
orebody:
  strike_deg: 105
  dip_deg: 32
  dip_direction_deg: 15
  dip_positive_down: true
compositing_length_m: 2.0
min_composite_length_m: 0.5
domain_by_lithology: true
target_lith_codes:
- GRSC
- GRSC1
- GRSC2
declustering:
  method: cell
  cell_size_xy_m: 200
  cell_size_z_m: 5
variogram:
  directions:
  - name: along_strike
    azimuth: 105
    dip: 0
    tolerance: 22.5
  - name: down_dip
    azimuth: 15
    dip: 32
    tolerance: 22.5
  - name: normal_to_plane
    azimuth: 195
    dip: 58
    tolerance: 22.5
  lag_m: 50
  n_lags: 10
  max_distance_m: 500
  model_types:
  - exponential
  - spherical
  fit_method: weighted_ls
  max_samples: 800
  max_pairs: 200000
  anisotropy:
    ranges_m:
      strike: 360
      down_dip: 160
      normal: 70
  tuning:
    enabled: true
    target_range_m: 150
    nugget_ratio: 0.2
grid:
  origin_xyz:
  - 475500
  - 9465400
  - 570
  nx: 13
  ny: 46
  nz: 27
  dx: 100
  dy: 100
  dz: 10
simulation:
  n_real: 50
  seed: 1337
  search_radius_m:
  - 250
  - 120
  - 70
  max_neighbors: 24
  min_neighbors: 8
  kriging_type: OK
  n_jobs: 1
  krige_chunk_size: 2000
ci:
  n_real: 80
cutoff_grade: 3.0
density_t_per_m3: 2.43
rock_volume_factor: 0.055
validation:
  reference_data: Serric_Data.csv
  reference_columns:
    x: X
    y: Y
    z: Z
    grade: TGC_%
sensitivity:
  enabled: false
  n_real: 40
calibration:
  enabled: true
  reference_data: Serric_Data.csv
  reference_columns:
    grade: TGC_%
  method: quantile_mapping
trend:
  enabled: true
  columns:
  - z
  allow_disable: false
internal_validation:
  enabled: false
  model_csv: Tanga_MRE_2026-01-06 1/OneDrive_2026-01-06/Export Final/04 BM/CSV/MODEL_OK.csv

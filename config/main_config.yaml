publication:
  target_journal: JAES
  story: geology_led_sgs_hardboundary_geology_aligned_250_200_20_nr100
parameter_rationale:
  selection_principle: geological observation first, numerical control second, validation as adequacy check; parameters are fixed before SGS interpretation rather than tuned to the closest histogram.
  compositing: 2 m support regularises variable assay intervals while preserving the vertical scale of logged graphitic and weathering contacts; minimum retained length is 0.5 m.
  simulation_support: 25 x 25 x 2 m cells preserve graphitic-body morphology and contact curvature without treating assays as mappable panels; 2 m vertical support remains aligned with compositing, weathering and contact scale.
  reporting_support: 50 x 50 x 2 m blocks are a two-by-two lateral aggregation tied to the closest local drill spacing and stabilise map-scale uncertainty diagnostics while retaining 2 m contact/weathering resolution.
  domains: fresh graphitic, weathered graphitic and host/waste categories preserve the local lithology/weathering controls being tested and avoid graphitic-only interpretation.
  threshold_3pct_tgc: selected before SGS as a study-dataset geological screening threshold separating weakly graphitic/background material from more continuous graphitic-schist support.
  boundary_policy: hard boundaries are used as a geological-prior end member before any future soft-boundary sensitivity.
  axis_convention: 000/180 strike, 090/30 down dip and 270/60 normal separate graphitic-corridor continuity from thickness-normal continuity.
  variogram_ranges_m: 250/200/20 m encodes strongest fabric-parallel continuity, slightly shorter down-dip continuity and short thickness-normal continuity; one exponential structure and one nugget interpretation are retained in normal-score space.
  search_radii_m: 250/200/20 m match the geological/variogram axis concept rather than being tuned from validation diagnostics.
  neighbourhood: min/max 3/20 provides a small local conditioning set while limiting dense-cluster influence; this implementation does not enforce a minimum-drillhole rule at each simulated node.
  local_update_every: the SGS local conditioning tree is refreshed after every simulated node (`local_update_every=1`) for the canonical production ensemble. This avoids a batching approximation and is the most direct implementation of sequential conditioning, although it is slower than batched local-tree refreshes.
  trend_disabled: vertical trend detrending is disabled for the canonical production SGS because the trend-plus-residual workflow simulates unbounded residuals and can create physically invalid negative TGC values in low-grade host/waste cells. Domain-wise raw-TGC NST keeps the back-transform bounded by observed non-negative TGC values while preserving the geological split between graphitic and host/waste domains; elevation trends are treated as diagnostic geological context rather than imposed as a production-grade drift correction.
  dynamic_local_dip: not used; a reproducible cell-wise dip-string model is not part of the public audit package, so local anisotropy/unfolding is deferred to a full-rerun sensitivity.
  realisations: 100 realisations support stable percentile, probability and cutoff-occupancy summaries.
  random_seed: seed 1337 fixes stochastic reproducibility and is not a geological parameter.
workflow_contract:
  require_canonical_paths: true
  canonical_config_path: config/main_config.yaml
  canonical_output_dir: output/a3_geology_aligned_250_200_20_nr100
  allow_noncanonical_with_env: ALLOW_NONCANONICAL_RUN
reporting_grid:
  origin_xyz: *id001
  nx: 26
  ny: 92
  nz: 135
  dx: 50
  dy: 50
  dz: 2
postrun_review_pack:

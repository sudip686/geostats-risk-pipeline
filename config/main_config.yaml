  - 475500
  - 9465400
  - 570
  nx: 52
  ny: 184
  nz: 135
  dx: 25
  dy: 25
  dz: 2
simulation:
  n_real: 100
  seed: 1337
  search_radius_m:
  - 250
  - 200
  - 20
  max_neighbors: 20
  min_neighbors: 3
  require_full_neighborhood: true
  cascade_allow_zero_neighbor_fallback: true
  checkpoint_every: 5000
  local_update_every: 1
  kriging_type: OK
  n_jobs: 20
  cascade_n_jobs: 20
  cascade_safe_max_workers: 20
  krige_chunk_size: 2000
ci:
  n_real: 3
cutoff_grade: 3.0
density_t_per_m3: 2.43

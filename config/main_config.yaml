    rationale: single-structure pilot model retained unless multi-scale continuity is demonstrated explicitly
  directions:
  - name: along_strike
    azimuth: 0
    dip: 0
    tolerance: 22.5
  - name: down_dip
    azimuth: 90
    dip: 30
    tolerance: 22.5
  - name: normal_to_plane
    azimuth: 270
    dip: 60
    tolerance: 22.5
  lag_m: 50
  n_lags: 10
  max_distance_m: 500
  model_types:
  - exponential
  - spherical
  fit_method: weighted_ls
  max_samples: 800
  max_pairs: 200000
  anisotropy:
    ranges_m:
      strike: 250
      down_dip: 200
      normal: 20
  tuning:
    enabled: true
    target_range_m: 250
    nugget_ratio: 0.2
grid:

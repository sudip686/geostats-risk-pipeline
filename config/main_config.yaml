    contact_analysis: true
    domain_uncertainty: true
    thickness_geometry: true
    confidence_gradient: true
paper_outputs:
  auto_update_root_text: false
runtime_profiles:
  fast2x:
    description: Exploratory speed profile that keeps grid geometry, search radii, and neighborhood policy unchanged while halving the realization count.
    overrides:
      simulation:
        n_real: 50
  fast3x:
    description: Exploratory speed profile that keeps grid geometry, search radii, and neighborhood policy unchanged while reducing the realization count to 34.
    overrides:
      simulation:
        n_real: 34







crs_epsg: 32737
data_dir: data
grade_field: tgc_pct
grade_units: '%'
orebody:
  strike_deg: 105
  dip_deg: 32
  dip_direction_deg: 15
  dip_positive_down: true
compositing_length_m: 2.0
min_composite_length_m: 0.5
domain_by_lithology: true
target_lith_codes:
- FR
- OX
- TR
declustering:
  method: cell
  cell_size_xy_m: 200
  cell_size_z_m: 5
variogram:
  directions:
  - name: along_strike
    azimuth: 105
    dip: 0
    tolerance: 22.5
  - name: down_dip
    azimuth: 15
    dip: 32
    tolerance: 22.5
  - name: normal_to_plane
    azimuth: 195
    dip: 58
    tolerance: 22.5
  lag_m: 50
  n_lags: 10
  max_distance_m: 500
  model_types:
  - exponential
  - spherical
  fit_method: weighted_ls
  max_samples: 2500
  max_pairs: 200000
  anisotropy:
    ranges_m:
      strike: 360
      down_dip: 160
      normal: 70
  tuning:
    enabled: true
    target_range_m: 150
    nugget_ratio: 0.2
grid:
  origin_xyz:
  - 0
  - 0
  - 0
  nx: 5
  ny: 5
  nz: 33
  dx: 25
  dy: 25
  dz: 5
simulation:
  n_real: 50
  seed: 1337
  search_radius_m:
  - 120
  - 80
  - 20
  max_neighbors: 16
  min_neighbors: 4
  kriging_type: OK
  n_jobs: 4
  krige_chunk_size: 2000
ci:
  n_real: 10
cutoff_grade: 3.0
density_t_per_m3: 2.43
rock_volume_factor: 0.055
validation:
  reference_data: Serric_Data.csv
  reference_columns:
    x: X
    y: Y
    z: Z
    grade: TGC_%
sensitivity:
  enabled: true
  n_real: 20
calibration:
  enabled: true
  reference_data: Serric_Data.csv
  reference_columns:
    grade: TGC_%
  method: quantile_mapping
trend:
  enabled: true
  columns:
  - z
  allow_disable: false
internal_validation:
  enabled: true
  model_csv: outputs/internal_validation/model_input/MODEL_OK.csv
data_source: repo
paths:
  local_data_dir: data
  repo_data_dir: demo_data
